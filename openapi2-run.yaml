# ==============================================================================
# Google Cloud API Gateway - OpenAPI 2.0 Specification (Agent Gateway)
# 프로젝트: 코웨이 AI 협업포털 회의록 자동화 게이트웨이
# ==============================================================================

swagger: "2.0"
info:
  title: "Coway Meeting Notes & Diarization Agent Gateway"
  description: "Unified Enterprise Ingress Gateway for Coway AI Meeting Notes, Speaker Diarization, and Template Management."
  version: "1.0.0"
schemes:
  - "https"
produces:
  - "application/json"
consumes:
  - "application/json"

paths:

  # ============================================================================
  # 0. Web UI & Static Assets
  # ============================================================================
  /:
    get:
      summary: "웹 UI 포털 메인 화면"
      description: "화이트 & 에메랄드 테마 AI 협업포털 메인 화면을 서빙합니다."
      operationId: "serveWebIndex"
      x-google-backend:
        address: "${BACKEND_CLOUD_RUN_URL}/"
        jwt_audience: "${BACKEND_CLOUD_RUN_URL}"
      produces:
        - "text/html"
      responses:
        200:
          description: "Web UI HTML Page"

  /static/style.css:
    get:
      summary: "Web UI CSS Stylesheet"
      description: "Serves style.css"
      operationId: "serveStyleCss"
      x-google-backend:
        address: "${BACKEND_CLOUD_RUN_URL}/static/style.css"
        jwt_audience: "${BACKEND_CLOUD_RUN_URL}"
      produces:
        - "text/css"
      responses:
        200:
          description: "CSS Stylesheet"

  /static/app.js:
    get:
      summary: "Web UI Client JavaScript"
      description: "Serves app.js"
      operationId: "serveAppJs"
      x-google-backend:
        address: "${BACKEND_CLOUD_RUN_URL}/static/app.js"
        jwt_audience: "${BACKEND_CLOUD_RUN_URL}"
      produces:
        - "application/javascript"
      responses:
        200:
          description: "Client JavaScript"

  # ============================================================================
  # 1. Health & Current Notes Endpoints
  # ============================================================================
  /healthz:
    get:
      summary: "게이트웨이 및 백엔드 헬스체크"
      operationId: "healthCheck"
      x-google-backend:
        address: "${BACKEND_CLOUD_RUN_URL}/healthz"
        jwt_audience: "${BACKEND_CLOUD_RUN_URL}"
      responses:
        200:
          description: "정상 가동 중"

  /api/v1/notes/current:
    get:
      summary: "현재 회의록 및 전사본 전문 조회"
      operationId: "getCurrentNotes"
      x-google-backend:
        address: "${BACKEND_CLOUD_RUN_URL}/api/v1/notes/current"
        jwt_audience: "${BACKEND_CLOUD_RUN_URL}"
      parameters:
        - name: "sample"
          in: "query"
          required: false
          type: "string"
      responses:
        200:
          description: "성공"

  # ============================================================================
  # 2. Media Processing & AI Notes Generation Endpoints (GCS Resumable Direct Upload)
  # ============================================================================
  /api/v1/notes/get-upload-session:
    post:
      summary: "GCS Direct Resumable Upload 세션 URL 발급"
      operationId: "getUploadSession"
      x-google-backend:
        address: "${BACKEND_CLOUD_RUN_URL}/api/v1/notes/get-upload-session"
        jwt_audience: "${BACKEND_CLOUD_RUN_URL}"
      responses:
        200:
          description: "GCS Resumable Upload 세션 URL 발급 완료"

  /api/v1/notes/process-gcs-media:
    post:
      summary: "GCS 다이렉트 업로드 완료 미디어 분석 및 회의록 생성"
      operationId: "processGcsMedia"
      x-google-backend:
        address: "${BACKEND_CLOUD_RUN_URL}/api/v1/notes/process-gcs-media"
        jwt_audience: "${BACKEND_CLOUD_RUN_URL}"
        deadline: 600.0
      responses:
        200:
          description: "GCS 미디어 회의록 분석 완료"

  /api/v1/notes/process-uri:
    post:
      summary: "GCS 버킷 또는 로컬 URI 기반 회의록/전사본 생성"
      operationId: "processUriMedia"
      x-google-backend:
        address: "${BACKEND_CLOUD_RUN_URL}/api/v1/notes/process-uri"
        jwt_audience: "${BACKEND_CLOUD_RUN_URL}"
        deadline: 600.0
      responses:
        200:
          description: "AI 회의록 생성 완료"

  /api/v1/notes/replace-speakers:
    post:
      summary: "화자 이름 1-Click 일괄 치환"
      operationId: "replaceSpeakers"
      x-google-backend:
        address: "${BACKEND_CLOUD_RUN_URL}/api/v1/notes/replace-speakers"
        jwt_audience: "${BACKEND_CLOUD_RUN_URL}"
      responses:
        200:
          description: "화자 치환 완료"

  /api/v1/notes/process-drive:
    post:
      summary: "Google Drive 파일 ID 기반 녹화본 처리"
      operationId: "processDriveMedia"
      x-google-backend:
        address: "${BACKEND_CLOUD_RUN_URL}/api/v1/notes/process-drive"
        jwt_audience: "${BACKEND_CLOUD_RUN_URL}"
        deadline: 600.0
      responses:
        200:
          description: "Drive 녹화본 회의록 생성 완료"

  /api/v1/media/verify-url:
    post:
      summary: "미디어 URL 접근성 및 MIME 스트림 실시간 검증"
      operationId: "verifyMediaUrl"
      x-google-backend:
        address: "${BACKEND_CLOUD_RUN_URL}/api/v1/media/verify-url"
        jwt_audience: "${BACKEND_CLOUD_RUN_URL}"
      responses:
        200:
          description: "URL 검증 결과"

  /api/v1/storage/bucket-files:
    get:
      summary: "GCS 버킷 및 data/input_media 경로 미디어 파일 검색"
      operationId: "listBucketFiles"
      x-google-backend:
        address: "${BACKEND_CLOUD_RUN_URL}/api/v1/storage/bucket-files"
        jwt_audience: "${BACKEND_CLOUD_RUN_URL}"
      responses:
        200:
          description: "미디어 파일 목록 반환"

  # ============================================================================
  # 3. Meeting Template Management Endpoints
  # ============================================================================
  /api/v1/templates:
    get:
      summary: "회의 템플릿 목록 조회"
      operationId: "listTemplates"
      x-google-backend:
        address: "${BACKEND_CLOUD_RUN_URL}/api/v1/templates"
        jwt_audience: "${BACKEND_CLOUD_RUN_URL}"
      responses:
        200:
          description: "템플릿 목록"

  /api/v1/templates/{template_id}:
    get:
      summary: "특정 회의 템플릿 상세 및 프롬프트 조회"
      operationId: "getTemplateDetail"
      x-google-backend:
        address: "${BACKEND_CLOUD_RUN_URL}"
        jwt_audience: "${BACKEND_CLOUD_RUN_URL}"
        path_translation: APPEND_PATH_TO_ADDRESS
      parameters:
        - name: "template_id"
          in: "path"
          required: true
          type: "string"
      responses:
        200:
          description: "템플릿 상세"
    put:
      summary: "특정 회의 템플릿 프롬프트 수정 및 저장"
      operationId: "updateTemplatePrompt"
      x-google-backend:
        address: "${BACKEND_CLOUD_RUN_URL}"
        jwt_audience: "${BACKEND_CLOUD_RUN_URL}"
        path_translation: APPEND_PATH_TO_ADDRESS
      parameters:
        - name: "template_id"
          in: "path"
          required: true
          type: "string"
      responses:
        200:
          description: "템플릿 수정 완료"

  /api/v1/templates/{template_id}/reset:
    post:
      summary: "회의 템플릿을 시스템 기본값으로 복원"
      operationId: "resetTemplatePrompt"
      x-google-backend:
        address: "${BACKEND_CLOUD_RUN_URL}"
        jwt_audience: "${BACKEND_CLOUD_RUN_URL}"
        path_translation: APPEND_PATH_TO_ADDRESS
      parameters:
        - name: "template_id"
          in: "path"
          required: true
          type: "string"
      responses:
        200:
          description: "기본값 복원 완료"

  /api/v1/reports:
    get:
      summary: "보관된 회의록 리포트 목록 조회"
      operationId: "listReports"
      x-google-backend:
        address: "${BACKEND_CLOUD_RUN_URL}/api/v1/reports"
        jwt_audience: "${BACKEND_CLOUD_RUN_URL}"
        deadline: 60.0
      parameters:
        - name: "search"
          in: "query"
          required: false
          type: "string"
        - name: "template_type"
          in: "query"
          required: false
          type: "string"
      responses:
        200:
          description: "리포트 목록 반환"

  /api/v1/reports/delete:
    post:
      summary: "특정 회의록 리포트 삭제 (POST 백업)"
      operationId: "deleteReportPost"
      x-google-backend:
        address: "${BACKEND_CLOUD_RUN_URL}/api/v1/reports/delete"
        jwt_audience: "${BACKEND_CLOUD_RUN_URL}"
        deadline: 60.0
      responses:
        200:
          description: "리포트 삭제 완료"

  /api/v1/reports/{report_id}:
    get:
      summary: "특정 회의록 리포트 상세 데이터 조회"
      operationId: "getReportDetail"
      x-google-backend:
        address: "${BACKEND_CLOUD_RUN_URL}"
        jwt_audience: "${BACKEND_CLOUD_RUN_URL}"
        path_translation: APPEND_PATH_TO_ADDRESS
        deadline: 60.0
      parameters:
        - name: "report_id"
          in: "path"
          required: true
          type: "string"
      responses:
        200:
          description: "리포트 상세 데이터 반환"
    delete:
      summary: "특정 회의록 리포트 삭제"
      operationId: "deleteReport"
      x-google-backend:
        address: "${BACKEND_CLOUD_RUN_URL}"
        jwt_audience: "${BACKEND_CLOUD_RUN_URL}"
        path_translation: APPEND_PATH_TO_ADDRESS
        deadline: 60.0
      parameters:
        - name: "report_id"
          in: "path"
          required: true
          type: "string"
        - name: "secret"
          in: "query"
          required: false
          type: "string"
      responses:
        200:
          description: "리포트 삭제 완료"

  /api/v1/reports/{report_id}/stt-status:
    get:
      summary: "특정 회의록의 Cloud STT 비동기 처리 상태 및 전사본 조회"
      operationId: "getReportSttStatus"
      x-google-backend:
        address: "${BACKEND_CLOUD_RUN_URL}"
        jwt_audience: "${BACKEND_CLOUD_RUN_URL}"
        path_translation: APPEND_PATH_TO_ADDRESS
        deadline: 60.0
      parameters:
        - name: "report_id"
          in: "path"
          required: true
          type: "string"
      responses:
        200:
          description: "STT 처리 상태 반환"

  /api/v1/reports/{report_id}/rerun-stt:
    post:
      summary: "특정 회의록의 Cloud STT 비동기 전사 재실행"
      operationId: "rerunReportStt"
      x-google-backend:
        address: "${BACKEND_CLOUD_RUN_URL}"
        jwt_audience: "${BACKEND_CLOUD_RUN_URL}"
        path_translation: APPEND_PATH_TO_ADDRESS
        deadline: 60.0
      parameters:
        - name: "report_id"
          in: "path"
          required: true
          type: "string"
      responses:
        200:
          description: "STT 재전사 작업 시작"

  # ============================================================================
  # 6. System Diagnostics & Real-time Logs
  # ============================================================================
  /api/v1/system/logs:
    get:
      summary: "실시간 시스템 진단 및 에러 분석 로그 조회"
      operationId: "getSystemLogs"
      x-google-backend:
        address: "${BACKEND_CLOUD_RUN_URL}/api/v1/system/logs"
        jwt_audience: "${BACKEND_CLOUD_RUN_URL}"
      parameters:
        - name: "level"
          in: "query"
          required: false
          type: "string"
        - name: "search"
          in: "query"
          required: false
          type: "string"
        - name: "limit"
          in: "query"
          required: false
          type: "integer"
      responses:
        200:
          description: "시스템 로그 목록 반환"
    delete:
      summary: "실시간 시스템 로그 버퍼 비우기"
      operationId: "clearSystemLogs"
      x-google-backend:
        address: "${BACKEND_CLOUD_RUN_URL}/api/v1/system/logs"
        jwt_audience: "${BACKEND_CLOUD_RUN_URL}"
      responses:
        200:
          description: "로그 버퍼 초기화 완료"




